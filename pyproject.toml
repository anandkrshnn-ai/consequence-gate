[project]
name = "consequence-gate"
version = "0.1.0"
description = "Speculative outcome-simulation gate for AI agent tool calls -- predicts consequence before execution and steers agents toward safer alternatives."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["consequence_gate*"]
