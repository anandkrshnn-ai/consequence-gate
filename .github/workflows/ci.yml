name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    # Real PostgreSQL for the EXPLAIN fixture tests
    # (tests/test_database_explain_fixture.py). Tests skip gracefully when
    # the database is unreachable (e.g. local runs without PostgreSQL).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: consequence
          POSTGRES_PASSWORD: consequence
          POSTGRES_DB: consequence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consequence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify package version consistency
        run: |
          python -c "
          from consequence_gate import __version__
          with open('pyproject.toml', 'r', encoding='utf-8') as f:
              for line in f:
                  if line.strip().startswith('version ='):
                      pyproj_ver = line.split('=')[1].strip().strip('\"\'')
                      break
          assert __version__ == pyproj_ver, f'Version mismatch: __init__.py ({__version__}) != pyproject.toml ({pyproj_ver})'
          print(f'✓ Version verified: {__version__}')
          "

      - name: Run linter and formatter checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest with coverage
        run: |
          pytest --cov=consequence_gate --cov-report=term-missing --cov-fail-under=65

      - name: Verify CLI entrypoint
        run: |
          consequence-gate --version
          consequence-gate backtest examples/benchmark_traces.jsonl
          consequence-gate backtest examples/benchmark_traces.jsonl --json
